<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>📢 صانع الإعلانات والتنويهات</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
    <style>
        body { direction: rtl; padding: 20px; font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; }
        .card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; max-width: 800px; margin: 0 auto; }
        .form-group { margin-bottom: 20px; text-align: right; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        input[type="text"], textarea, select { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 15px; box-sizing: border-box; }
        textarea { resize: vertical; min-height: 120px; }
        .btn { padding: 12px 25px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; }
        .btn-primary { background: #10b981; color: white; margin-top: 10px; }
        .btn-primary:hover { background: #059669; }
        .loading { display: none; margin-top: 15px; color: #047857; font-weight: bold; text-align: center;}
        
        .status-box { margin-top:20px; padding:15px; border-radius:10px; display:none; font-weight:bold; text-align:center; }
        .status-success { background:#e6f4ea; color:#0d652d; border:1px solid #ceead6; display:block; }
        .status-error { background:#fce8e6; color:#d93025; border:1px solid #fad2cf; display:block; }
    </style>
</head>
<body>

    <div class="card">
        <h3 style="margin-top:0; color:var(--primary); display:flex; align-items:center; gap:10px;">
            <span style="font-size:24px;">📢</span> صانع إعلانات صفحة الفيسبوك
        </h3>
        <p style="color:var(--text-muted); font-size:14px; margin-bottom:20px;">
            قم بملء البيانات أدناه لتوليد صورة للإعلان أو التنويه بنفس تصميم شهادات المدرسة.
        </p>

        <div class="form-group">
            <label>عنوان التنويه (اختياري):</label>
            <input type="text" id="posterTitle" placeholder="مثال: تنويه هام، إعلان رحلة، خبر عاجل...">
        </div>

        <div class="form-group">
            <label>نص الخبر أو التنويه (مطلوب):</label>
            <textarea id="posterBody" placeholder="اكتب هنا تفاصيل الخبر أو التنويه..."></textarea>
        </div>

        <div class="form-group">
            <label>النص السفلي Footer (اختياري):</label>
            <input type="text" id="posterFooter" placeholder="مثال: إدارة المدرسة تتمنى لكم عاماً سعيداً" value="إدارة المدرسة">
        </div>

        <div class="form-group" style="display:flex; gap:10px;">
            <div style="flex:1;">
                <label>أبعاد الصورة:</label>
                <select id="posterOrientation">
                    <option value="square">مربعة (مناسبة للفيسبوك والانستجرام 1080x1080)</option>
                    <option value="landscape">عرضية (لاندسكيب 1920x1080)</option>
                    <option value="portrait">طولية (بورتريه 1080x1920)</option>
                </select>
            </div>
            <div style="flex:1;">
                <label>حجم الخط للنص الأساسي:</label>
                <select id="posterFontSize">
                    <option value="60">كبير جداً</option>
                    <option value="50" selected>كبير (افتراضي)</option>
                    <option value="40">متوسط</option>
                    <option value="32">صغير (للنصوص الطويلة)</option>
                </select>
            </div>
        </div>

        <button class="btn btn-primary" onclick="generatePoster()" id="genBtn">
            🖼️ استخراج الصورة (PNG)
        </button>
        
        <div id="loading" class="loading">⏳ جاري إعداد الصورة... الرجاء الانتظار.</div>
        <div id="statusBox" class="status-box"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/logos.js"></script>
    <script>
        window.onload = async () => {
            // Can add role requirement here if needed
            // requireRole('Admin', 'HeadSecretary', 'User'); 
        };

        async function generatePoster() {
            var title = document.getElementById('posterTitle').value.trim();
            var bodyText = document.getElementById('posterBody').value.trim();
            var footerText = document.getElementById('posterFooter').value.trim();
            var orientation = document.getElementById('posterOrientation').value;
            var fontSize = document.getElementById('posterFontSize').value;

            if(!bodyText) {
                alert('الرجاء كتابة نص الخبر أو التنويه');
                return;
            }

            var btn = document.getElementById('genBtn');
            var loader = document.getElementById('loading');
            var statusBox = document.getElementById('statusBox');

            btn.disabled = true;
            loader.style.display = 'block';
            statusBox.style.display = 'none';

            try {
                let logoDio = typeof LOGO_DIOCESE_BASE64 !== 'undefined' ? LOGO_DIOCESE_BASE64 : '';
                
                // Determine dimensions based on orientation
                let canvasWidth = 1080;
                let canvasHeight = 1080;
                
                if (orientation === 'landscape') {
                    canvasWidth = 1920;
                    canvasHeight = 1080;
                } else if (orientation === 'portrait') {
                    canvasWidth = 1080;
                    canvasHeight = 1920;
                }

                // Format the body text to preserve line breaks
                let formattedBody = bodyText.replace(/\n/g, '<br>');

                let pageHtml = `
                    <div style="font-family:'Segoe UI', Tahoma, sans-serif; text-align:center; direction:rtl; padding:0; width: ${canvasWidth}px; height: ${canvasHeight}px; box-sizing: border-box; background: white; display: flex; flex-direction: column;">
                        <div style="padding: 40px; margin: 0; background: #fdf8ec; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; flex: 1;">
                            <div style="border: 12px double #c9a227; padding: 8px; box-sizing: border-box; background: white; flex: 1; display: flex; flex-direction: column;">
                                <div style="border: 2px solid #c9a227; padding: 30px; position: relative; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; box-sizing: border-box; background: #fdf8ec; flex: 1;">
                                    
                                    <!-- Logos -->
                                    <div style="position:absolute; top:30px; right:45px; z-index: 2;">
                                        <img src="data:image/png;base64,${logoDio}" style="width:145px; height:145px; object-fit:contain;" onerror="this.style.display='none'">
                                    </div>
                                    <div style="position:absolute; top:30px; left: 50%; transform: translateX(-50%); z-index: 2;">
                                        <img src="/images/cross.png" style="width:145px; height:145px; object-fit:contain;" onerror="this.style.display='none'">
                                    </div>
                                    <div style="position:absolute; top:30px; left:45px; z-index: 2;">
                                        <img src="/images/Logo.png" style="width:145px; height:145px; object-fit:contain; border-radius: 50%; background-color: white; padding: 5px;" onerror="this.style.display='none'">
                                    </div>
                                    
                                    <!-- Watermark -->
                                    <div style="position:absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.05; z-index: 0; pointer-events: none;">
                                        <img src="/images/Logo.png" style="width:${canvasWidth * 0.6}px; height:${canvasWidth * 0.6}px; object-fit:contain;" onerror="this.style.display='none'">
                                    </div>

                                    <div style="margin-top: 180px; width: 100%; position: relative; z-index: 2; display: flex; flex-direction: column; flex: 1;">
                                        
                                        <!-- Title -->
                                        ${title ? `
                                            <h1 style="font-family: 'Aref Ruqaa', serif; color:#1a2744; font-size:80px; margin-bottom:40px; margin-top:0; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); border-bottom: 3px dashed #c9a227; padding-bottom: 20px; display: inline-block; align-self: center;">
                                                ${title}
                                            </h1>
                                        ` : ''}
                                        
                                        <!-- Body -->
                                        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; padding: 0 40px;">
                                            <p style="font-family: 'Segoe UI', Tahoma, sans-serif; font-size: ${fontSize}px; color: #7a1f1f; font-weight: bold; line-height: 1.8; text-align: center; text-shadow: 1px 1px 2px rgba(0,0,0,0.05); margin: 0;">
                                                ${formattedBody}
                                            </p>
                                        </div>

                                        <!-- Footer -->
                                        ${footerText ? `
                                            <div style="margin-top: auto; padding-top: 30px; width: 100%; display: flex; justify-content: center; align-items: center; flex-direction: column;">
                                                <div style="width: 50%; height: 2px; background: #c9a227; margin-bottom: 20px;"></div>
                                                <p style="font-family: 'Aref Ruqaa', serif; font-size:40px; color:#1a2744; margin: 0; direction: rtl;">
                                                    ${footerText}
                                                </p>
                                            </div>
                                        ` : ''}

                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                let tempContainer = document.createElement('div');
                tempContainer.innerHTML = pageHtml;
                tempContainer.style.position = 'absolute';
                tempContainer.style.top = '-9999px';
                tempContainer.style.left = '-9999px';
                document.body.appendChild(tempContainer);

                let captureEl = tempContainer.children[0];

                html2canvas(captureEl, { scale: 1.5, useCORS: true }).then(canvas => {
                    let link = document.createElement('a');
                    let fileName = title ? title.replace(/\s+/g, '_') : 'Announcement';
                    link.download = 'Poster_' + fileName + '.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    
                    document.body.removeChild(tempContainer);
                    
                    statusBox.style.display = 'block';
                    statusBox.className = 'status-box status-success';
                    statusBox.textContent = '✅ تم تحميل الصورة بنجاح!';
                    
                    btn.disabled = false;
                    loader.style.display = 'none';
                });
                
            } catch (e) {
                console.error(e);
                statusBox.style.display = 'block';
                statusBox.className = 'status-box status-error';
                statusBox.textContent = '❌ حدث خطأ أثناء استخراج الصورة.';
                btn.disabled = false;
                loader.style.display = 'none';
            }
        }
    </script>
    <script src="/js/layout.js"></script>
</body>
</html>
