<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>الطلاب المعرضين للخطر ⚠️</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .filter-bar { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: var(--box-shadow); margin-bottom: 25px; border-right: 5px solid var(--warning); display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap; }
        .filter-item { flex: 1; min-width: 200px; }
        .risk-high { background-color: #fee2e2; color: #991b1b; }
        .risk-medium { background-color: #fef3c7; color: #92400e; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="filter-bar">
        <div class="filter-item">
            <label>حد الغياب المسموح (%)</label>
            <input type="number" id="absenceLimit" value="15" min="5" max="100">
        </div>
        <div class="filter-item">
            <label>الحد الأدنى للدرجات (%)</label>
            <input type="number" id="gradeLimit" value="50" min="0" max="100">
        </div>
        <div>
            <button class="btn btn-warning" onclick="loadAtRiskStudents()" style="background:var(--warning); color:#fff; border:none; padding:10px 20px; border-radius:8px; font-weight:bold; cursor:pointer;">بحث وفلترة</button>
            <button class="btn btn-primary" onclick="window.print()">طباعة</button>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>اسم الطالب</th>
                    <th>الفصل</th>
                    <th>نسبة الغياب</th>
                    <th>متوسط الدرجات</th>
                    <th>مستوى الخطر</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody id="studentsTable">
                <!-- Data will be loaded here -->
            </tbody>
        </table>
    </div>

    <script src="/js/app.js"></script>
    <script>
        async function loadAtRiskStudents() {
            const absenceLimit = parseFloat(document.getElementById('absenceLimit').value);
            const gradeLimit = parseFloat(document.getElementById('gradeLimit').value);
            
            document.getElementById('studentsTable').innerHTML = `<tr><td colspan="6"><div class="spinner" style="margin: 20px auto;"></div></td></tr>`;

            const res = await fetchApi('/Reports/at-risk');
            if (!res || !res.success) {
                document.getElementById('studentsTable').innerHTML = `<tr><td colspan="6" style="color:red;">حدث خطأ في جلب البيانات</td></tr>`;
                return;
            }

            let html = "";
            res.data.forEach(st => {
                let riskClass = "";
                let riskLabel = "";
                if(st.absencePercentage > absenceLimit && st.gradePercentage > 0 && st.gradePercentage < gradeLimit) {
                    riskClass = "risk-high";
                    riskLabel = `<span class="badge" style="background:#dc2626; color:#fff;">خطر مرتفع (غياب+رسوب)</span>`;
                } else if (st.absencePercentage > absenceLimit) {
                    riskClass = "risk-medium";
                    riskLabel = `<span class="badge" style="background:#d97706; color:#fff;">خطر متوسط (تجاوز الغياب)</span>`;
                } else if (st.gradePercentage > 0 && st.gradePercentage < gradeLimit) {
                    riskClass = "risk-medium";
                    riskLabel = `<span class="badge" style="background:#d97706; color:#fff;">خطر متوسط (ضعف مستوى)</span>`;
                } else {
                    return; // Not at risk based on filter
                }

                html += `<tr class="${riskClass}">
                    <td style="font-weight:bold;">${st.studentName}</td>
                    <td>${st.className}</td>
                    <td style="color:${st.absencePercentage > absenceLimit ? 'red' : 'inherit'}">${st.absencePercentage}%</td>
                    <td style="color:${(st.gradePercentage > 0 && st.gradePercentage < gradeLimit) ? 'red' : 'inherit'}">${st.gradePercentage}%</td>
                    <td>${riskLabel}</td>
                    <td>
                        <a href="/StudentComprehensiveProfile.html?id=${st.studentId}" class="btn" style="background:var(--primary); color:white; padding:5px 10px; font-size:12px;">عرض الملف</a>
                    </td>
                </tr>`;
            });
            document.getElementById('studentsTable').innerHTML = html || `<tr><td colspan="6">لا يوجد طلاب مطابقين لمعايير الخطر.</td></tr>`;
        }
        
        window.onload = () => loadAtRiskStudents();
    </script>
    <script src="/js/layout.js"></script>
</body>
</html>
