<!DOCTYPE html>
<html lang="ar">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>سجل أمهات الأم الشاطرة</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .table-container { width: 100%; overflow-x: auto; background: white; border-radius: 12px; border: 1px solid #eee; margin-top: 20px; box-shadow: var(--box-shadow); }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { padding: 15px; text-align: right; border-bottom: 1px solid #eee; }
        th { background: #f8fafc; color: #334155; font-weight: bold; }
        tr:hover { background: #f1f5f9; }
        
        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-add { background: var(--success); color: white; padding: 10px 15px; border-radius: 8px; text-decoration: none; font-weight: bold; }
        
        .empty-state { text-align: center; padding: 40px; color: #64748b; font-size: 16px; }
    </style>
</head>
<body>

    <div class="card" style="padding: 25px;">
        <div class="header-actions">
            <h3 style="margin:0; color:var(--primary); display:flex; align-items:center; gap:10px;">
                <span style="font-size:24px;">👩‍👧‍👦</span> سجل أمهات فصل "الأم الشاطرة"
            </h3>
            <a href="/AddMother.html" class="btn-add">➕ إضافة أم جديدة</a>
        </div>

        <input type="text" id="searchInput" placeholder="🔍 بحث باسم الأم..." onkeyup="filterTable()" style="padding: 10px; border-radius: 8px; border: 1px solid #ccc; width: 300px; font-family: inherit; margin-bottom: 15px;">

        <div id="statusBar" class="status-bar" style="display:none; padding:15px; border-radius:10px; text-align:center; font-weight:bold; margin-bottom: 15px;"></div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>التليفون</th>
                        <th>الواتساب</th>
                        <th>الأبناء في المدرسة</th>
                        <th>اسم الزوج</th>
                        <th>أب الاعتراف</th>
                    </tr>
                </thead>
                <tbody id="mothersTableBody">
                    <tr>
                        <td colspan="6" class="empty-state">⏳ جاري تحميل السجل...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        let mothers = [];
        let filteredMothers = [];

        window.onload = async () => {
            requireSmartMotherAccess();
            await loadMothers();
        };

        async function loadMothers() {
            try {
                const res = await fetchApi('/mothers');
                if (res && res.success) {
                    mothers = res.mothers;
                    filteredMothers = [...mothers];
                    renderTable();
                }
            } catch(e) {
                showStatus('statusBar', 'error', '❌ فشل تحميل البيانات');
            }
        }

        function filterTable() {
            const term = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!term) {
                filteredMothers = [...mothers];
            } else {
                filteredMothers = mothers.filter(m => m.name.toLowerCase().includes(term));
            }
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('mothersTableBody');
            if (filteredMothers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-state">✅ لا توجد أمهات مسجلات</td></tr>';
                return;
            }

            let html = '';
            filteredMothers.forEach(m => {
                html += `
                    <tr>
                        <td style="font-weight:bold; color:var(--primary);">${m.name}</td>
                        <td style="font-family: monospace; font-size: 14px;">${m.phone}</td>
                        <td style="font-family: monospace; font-size: 14px; color: var(--success);">${m.whatsapp || '-'}</td>
                        <td style="color:#3730a3; font-size: 13px;">${m.childrenNames || '-'}</td>
                        <td>${m.husbandName || '-'}</td>
                        <td>${m.confessionFather || '-'}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }
    </script>
    <script src="/js/layout.js"></script>
</body>
</html>
