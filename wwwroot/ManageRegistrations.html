<!DOCTYPE html>
<html lang="ar">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>⚙️ إدارة التسجيلات والطلبات المعلقة</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .table-container { width: 100%; overflow-x: auto; background: white; border-radius: 12px; border: 1px solid #eee; margin-top: 20px; box-shadow: var(--box-shadow); }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { padding: 15px; text-align: right; border-bottom: 1px solid #eee; }
        th { background: #f8fafc; color: #334155; font-weight: bold; }
        tr:hover { background: #f1f5f9; }
        
        .badge { display: inline-block; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .badge-new { background: #d1fae5; color: #065f46; }
        .badge-old { background: #e0e7ff; color: #3730a3; }
        
        .action-btn { padding: 8px 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; font-size: 12px; transition: opacity 0.2s; }
        .action-btn:hover { opacity: 0.9; }
        .btn-approve { background: var(--success); }
        .btn-reject { background: var(--danger); }
        
        .class-select { padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; width: 150px; }
        
        .empty-state { text-align: center; padding: 40px; color: #64748b; font-size: 16px; }
    </style>
</head>
<body>

    <div class="card" style="padding: 25px;">
        <h3 style="margin-top:0; color:var(--primary); display:flex; align-items:center; gap:10px;">
            <span style="font-size:24px;">📝</span> إدارة طلبات التسجيل المعلقة
        </h3>
        <p style="color:var(--text-muted); font-size:14px; margin-bottom:20px;">
            هذه القائمة تحتوي على طلبات التسجيل للطلاب الجدد أو تجديد الاشتراكات. يمكنك مراجعة الفصل المطلوب وتعديله قبل الموافقة.
        </p>

        <div id="statusBar" class="status-bar" style="margin-bottom:15px; display:none; padding:15px; border-radius:10px; text-align:center; font-weight:bold;"></div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>رقم الطلب</th>
                        <th>اسم الطالب</th>
                        <th>نوع الطلب</th>
                        <th>المرحلة/الحكومي</th>
                        <th>المبلغ المدفوع</th>
                        <th>الفصل المقترح والتعديل</th>
                        <th style="text-align:center;">إجراءات</th>
                    </tr>
                </thead>
                <tbody id="requestsTableBody">
                    <tr>
                        <td colspan="7" class="empty-state">⏳ جاري تحميل الطلبات المعلقة...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        let allMyClasses = [];
        let pendingRequests = [];

        window.onload = async () => {
            requireRole('Admin');
            
            try {
                // Fetch classes for the dropdown
                const classRes = await fetchApi('/users/me/classes');
                if (classRes && classRes.classes) {
                    allMyClasses = classRes.classes;
                }
                
                await loadPendingRequests();
            } catch (e) {
                console.error("Error loading page data:", e);
                showStatus('statusBar', 'error', 'حدث خطأ في تحميل البيانات الأساسية');
            }
        };

        async function loadPendingRequests() {
            const tbody = document.getElementById('requestsTableBody');
            
            try {
                const res = await fetchApi('/registrations/pending');
                if (res && res.success) {
                    pendingRequests = res.requests;
                    renderRequests();
                } else {
                    tbody.innerHTML = `<tr><td colspan="7" class="empty-state" style="color:var(--danger);">❌ خطأ: ${res?.message || 'فشل تحميل الطلبات'}</td></tr>`;
                }
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="7" class="empty-state" style="color:var(--danger);">❌ خطأ في الاتصال بالخادم</td></tr>`;
            }
        }

        function renderRequests() {
            const tbody = document.getElementById('requestsTableBody');
            
            if (pendingRequests.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty-state">✅ لا توجد طلبات معلقة حالياً</td></tr>';
                return;
            }

            let html = '';
            pendingRequests.forEach(req => {
                const typeBadge = req.isRenewal 
                    ? '<span class="badge badge-old">تجديد طالب قديم</span>' 
                    : '<span class="badge badge-new">طالب جديد</span>';
                
                const classOptions = allMyClasses.map(c => 
                    `<option value="${c.id}" ${c.id === req.classId ? 'selected' : ''}>${c.name} ${c.year ? '('+c.year+')' : ''}</option>`
                ).join('');

                const dateObj = new Date(req.requestDate);
                const dateStr = dateObj.toLocaleDateString('ar-EG') + ' ' + dateObj.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});

                html += `
                    <tr id="req-row-${req.id}">
                        <td style="color:#64748b; font-size:12px;">#${req.id}<br>${dateStr}</td>
                        <td style="font-weight:bold; color:var(--primary);">${req.name}</td>
                        <td>${typeBadge}</td>
                        <td>${req.govGrade || '-'}</td>
                        <td style="font-weight:bold; color:var(--success);">${req.amountPaid} ج.م</td>
                        <td>
                            <select id="class-select-${req.id}" class="class-select">
                                ${classOptions}
                            </select>
                        </td>
                        <td style="text-align:center; display:flex; gap:8px; justify-content:center;">
                            <button class="action-btn btn-approve" onclick="approveRequest(${req.id})">✔️ موافقة</button>
                            <button class="action-btn btn-reject" onclick="rejectRequest(${req.id})">❌ رفض</button>
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        async function approveRequest(id) {
            if (!confirm('هل أنت متأكد من الموافقة على هذا الطلب واعتماد البيانات في النظام؟')) return;

            const classId = parseInt(document.getElementById(`class-select-${id}`).value);
            
            try {
                const res = await fetchApi(`/registrations/${id}/approve`, 'POST', { classId: classId });
                if (res && res.success) {
                    showStatus('statusBar', 'success', `✅ ${res.message}`);
                    document.getElementById(`req-row-${id}`).style.display = 'none';
                    // Optional: remove from array
                    pendingRequests = pendingRequests.filter(r => r.id !== id);
                } else {
                    showStatus('statusBar', 'error', `❌ خطأ: ${res?.message || 'فشل الموافقة على الطلب'}`);
                }
            } catch (e) {
                showStatus('statusBar', 'error', '❌ خطأ في الاتصال بالخادم');
            }
        }

        async function rejectRequest(id) {
            if (!confirm('هل أنت متأكد من رفض وحذف هذا الطلب المعلق؟')) return;

            try {
                const res = await fetchApi(`/registrations/${id}/reject`, 'POST');
                if (res && res.success) {
                    showStatus('statusBar', 'success', `✅ ${res.message}`);
                    document.getElementById(`req-row-${id}`).style.display = 'none';
                    pendingRequests = pendingRequests.filter(r => r.id !== id);
                } else {
                    showStatus('statusBar', 'error', `❌ خطأ: ${res?.message || 'فشل رفض الطلب'}`);
                }
            } catch (e) {
                showStatus('statusBar', 'error', '❌ خطأ في الاتصال بالخادم');
            }
        }
    </script>
    <script src="/js/layout.js"></script>
</body>
</html>
