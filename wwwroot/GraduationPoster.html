<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>🎓 بوستر التخرج</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
    <style>
        body { direction: rtl; padding: 20px; font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; }
        .card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 20px; text-align: right; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        select { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 15px; box-sizing: border-box; }
        .btn { padding: 12px 25px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; }
        .btn-primary { background: #10b981; color: white; }
        .btn-primary:hover { background: #059669; }
        .loading { display: none; margin-top: 15px; color: #047857; font-weight: bold; text-align: center;}
        
        .image-preview { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; margin: 10px auto; border: 3px solid #cbd5e1; display: block; background: #e2e8f0; }
        
        .status-box { margin-top:20px; padding:15px; border-radius:10px; display:none; font-weight:bold; text-align:center; }
        .status-success { background:#e6f4ea; color:#0d652d; border:1px solid #ceead6; display:block; }
        .status-error { background:#fce8e6; color:#d93025; border:1px solid #fad2cf; display:block; }
    </style>
</head>
<body>

    <div class="card">
        <h3 style="margin-top:0; color:var(--primary); display:flex; align-items:center; gap:10px;">
            <span style="font-size:24px;">🎓</span> إعداد بوستر الخريجين
        </h3>
        <p style="color:var(--text-muted); font-size:14px; margin-bottom:20px;">
            اختر الفصل والسنة الدراسية لتحميل قائمة الناجحين، ثم اختر الطالب وارفق صورته.
        </p>

        <div class="form-group" style="display:flex; gap:10px;">
            <select id="classSelect" onchange="loadStudents()" style="flex:1;">
                <option value="">جاري التحميل...</option>
            </select>
            <select id="academicYearSelect" style="flex:1;" onchange="loadStudents()">
                <option value="">السنة (الافتراضية)</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>اسم الخريج (الناجحين فقط):</label>
            <select id="studentSelect">
                <option value="">-- اختر الفصل أولاً --</option>
            </select>
        </div>
        
        <div class="form-group" style="text-align: center;">
            <label>صورة الخريج:</label>
            <img src="/images/default_avatar.png" class="image-preview" id="imagePreview">
            <input type="file" accept="image/*" onchange="handleImageUpload(this)" style="margin-top: 10px; width: 100%;">
        </div>

        <button class="btn btn-primary" onclick="generatePoster()" id="genBtn">
            🖼️ استخراج البوستر (صورة PNG)
        </button>
        
        <div id="loading" class="loading">⏳ جاري إعداد الصورة... الرجاء الانتظار.</div>
        <div id="statusBox" class="status-box"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/logos.js"></script>
    <script>
        let studentImageSrc = '/images/default_avatar.png';
        let passedStudents = [];
        let classMap = {};

        window.onload = async () => {
            requireRole('Admin', 'HeadSecretary', 'StageSupervisor', 'User'); 
            try {
                const data = await fetchApi('/users/me/classes');
                const select = document.getElementById('classSelect');
                select.innerHTML = '<option value="">-- اختر الفصل --</option>';
                
                if (data && data.classes && data.classes.length > 0) {
                    let filteredClasses = data.classes.filter(c => 
                        (c.stage && c.stage.includes('كبار')) && 
                        (c.name && c.name.includes('الثالث'))
                    );
                    
                    if (filteredClasses.length > 0) {
                        let lastStage = null;
                        filteredClasses.forEach(c => {
                            classMap[c.id] = c;
                            if (c.stage !== lastStage) {
                                let group = document.createElement('optgroup');
                                group.label = c.stage;
                                select.appendChild(group);
                                lastStage = c.stage;
                            }
                            let opt = document.createElement('option');
                            opt.value = c.id;
                            opt.textContent = c.name + (c.year ? ' (' + c.year + ')' : '');
                            select.lastChild.appendChild(opt);
                        });
                    } else {
                        select.innerHTML = '<option value="">لا يوجد فصول لمرحلة كبار السنة الثالثة</option>';
                    }
                } else {
                    select.innerHTML = '<option value="">لا يوجد فصول متاحة</option>';
                }
            } catch (e) {
                console.error(e);
                document.getElementById('classSelect').innerHTML = '<option value="">خطأ في التحميل</option>';
            }
            loadAcademicYearsDropdown('academicYearSelect');
        };

        async function loadStudents() {
            const classId = document.getElementById('classSelect').value;
            const academicYear = document.getElementById('academicYearSelect').value;
            const studentSelect = document.getElementById('studentSelect');
            const statusBox = document.getElementById('statusBox');
            
            studentSelect.innerHTML = '<option value="">-- جاري تحميل الطلبة... --</option>';
            passedStudents = [];

            if (!classId) {
                studentSelect.innerHTML = '<option value="">-- اختر الفصل أولاً --</option>';
                return;
            }

            try {
                let url = `/results/class/${classId}?term=all&subject=all`;
                if(academicYear) url += `&academicYear=${encodeURIComponent(academicYear)}`;

                const response = await fetchApi(url);
                if (!response || !response.success || !response.students || response.students.length === 0) {
                    throw new Error('لا يوجد نتائج لهذا الفصل.');
                }

                // Filter out failures (less than 50%)
                passedStudents = response.students.filter(s => s.percentage >= 50);
                if(passedStudents.length === 0) throw new Error('لا يوجد طلاب ناجحين في هذا الفصل.');

                studentSelect.innerHTML = '<option value="">-- اختر الخريج --</option>';
                passedStudents.forEach(s => {
                    let opt = document.createElement('option');
                    opt.value = s.id;
                    opt.textContent = s.name;
                    studentSelect.appendChild(opt);
                });

                statusBox.style.display = 'none';

            } catch (e) {
                studentSelect.innerHTML = '<option value="">-- خطأ في التحميل --</option>';
                statusBox.className = 'status-box status-error';
                statusBox.textContent = e.message || 'حدث خطأ أثناء جلب النتائج.';
                statusBox.style.display = 'block';
            }
        }
        
        function handleImageUpload(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    studentImageSrc = e.target.result;
                    document.getElementById('imagePreview').src = studentImageSrc;
                }
                reader.readAsDataURL(file);
            }
        }

        async function generatePoster() {
            var studentSelect = document.getElementById('studentSelect');
            var studentId = studentSelect.value;
            if(!studentId) {
                alert('الرجاء اختيار الخريج من القائمة');
                return;
            }
            
            var studentName = studentSelect.options[studentSelect.selectedIndex].text;

            var btn = document.getElementById('genBtn');
            var loader = document.getElementById('loading');
            var statusBox = document.getElementById('statusBox');

            btn.disabled = true;
            loader.style.display = 'block';
            statusBox.style.display = 'none';

            try {
                let logoDio = typeof LOGO_DIOCESE_BASE64 !== 'undefined' ? LOGO_DIOCESE_BASE64 : '';
                
                let pageHtml = `
                    <div style="font-family:'Segoe UI', Tahoma, sans-serif; text-align:center; direction:rtl; padding:0; width: 1122px; height: 1800px; box-sizing: border-box; background: white; display: flex; flex-direction: column;">
                        <div style="padding: 50px; margin: 0; background: #fdf8ec; height: 1800px; box-sizing: border-box; display: flex; flex-direction: column; flex: 1;">
                            <div style="border: 12px double #c9a227; padding: 8px; box-sizing: border-box; background: white; flex: 1; display: flex; flex-direction: column;">
                                <div style="border: 2px solid #c9a227; padding: 15px; position: relative; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; box-sizing: border-box; background: #fdf8ec; flex: 1;">
                                    
                                    <!-- Logos -->
                                    <div style="position:absolute; top:25px; right:45px; z-index: 2;">
                                        <img src="data:image/png;base64,${logoDio}" style="width:145px; height:145px; object-fit:contain;" onerror="this.style.display='none'">
                                    </div>
                                    <div style="position:absolute; top:25px; left: 50%; transform: translateX(-50%); z-index: 2;">
                                        <img src="/images/cross.png" style="width:145px; height:145px; object-fit:contain;" onerror="this.style.display='none'">
                                    </div>
                                    <div style="position:absolute; top:25px; left:45px; z-index: 2;">
                                        <img src="/images/Logo.png" style="width:145px; height:145px; object-fit:contain; border-radius: 50%; background-color: white; padding: 5px;" onerror="this.style.display='none'">
                                    </div>
                                    
                                    <!-- Watermark removed as requested -->
                                    
                                    <!-- Titles -->
                                    <h1 style="font-family: 'Aref Ruqaa', serif; color:#1a2744; font-size:100px; margin-bottom:10px; margin-top:200px; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); position: relative; z-index: 2;">خريجي مرحلة كبار</h1>
                                    
                                    <div style="background: #1a2744; color: white; padding: 15px 50px; border-radius: 50px; font-size: 32px; font-weight: bold; margin-bottom: 50px; position: relative; z-index: 2; border: 4px solid #c9a227;">
                                        الدفعة السادسة للمدرسة
                                    </div>
                                    
                                    <!-- Student Info -->
                                    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 2; flex: 1; margin-top: 10px;">
                                        <div style="position: relative; padding: 15px; border-radius: 50%; border: 8px solid #c9a227; background: white; margin-bottom: 40px; box-shadow: 0 10px 25px rgba(0,0,0,0.15);">
                                            <img src="${studentImageSrc}" style="width: 850px; height: 850px; border-radius: 50%; object-fit: cover; display: block;">
                                        </div>
                                        
                                        <div style="font-family: 'Aref Ruqaa', serif; font-size: 85px; color: #1a2744; font-weight: bold; line-height: 1.3; text-align: center; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); margin-bottom: 20px;">
                                            ${studentName}
                                        </div>
                                    </div>
                                    
                                    <!-- Footer / Year -->
                                    <div style="margin-top: auto; padding-bottom: 50px; position: relative; z-index: 2; width: 100%; display: flex; justify-content: center; align-items: center; flex-direction: column;">
                                        <div style="width: 70%; height: 2px; background: #c9a227; margin-bottom: 30px;"></div>
                                        <p style="font-family: 'Segoe UI', Tahoma, sans-serif; font-size:40px; color:#7a1f1f; font-weight: bold; margin: 0; direction: rtl;">
                                            سنة التخرج: 2025-2026 م / 1742 ش
                                        </p>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </div>
                `;

                let tempContainer = document.createElement('div');
                tempContainer.innerHTML = pageHtml;
                tempContainer.style.position = 'absolute';
                tempContainer.style.top = '-9999px';
                tempContainer.style.left = '-9999px';
                document.body.appendChild(tempContainer);

                let captureEl = tempContainer.children[0];

                html2canvas(captureEl, { scale: 2, useCORS: true }).then(canvas => {
                    let link = document.createElement('a');
                    link.download = 'Graduation_Poster_' + studentName.replace(/\s+/g, '_') + '.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    
                    document.body.removeChild(tempContainer);
                    
                    statusBox.style.display = 'block';
                    statusBox.className = 'status-box status-success';
                    statusBox.textContent = '✅ تم تحميل بوستر التخرج بنجاح!';
                    
                    btn.disabled = false;
                    loader.style.display = 'none';
                });
                
            } catch (e) {
                console.error(e);
                statusBox.style.display = 'block';
                statusBox.className = 'status-box status-error';
                statusBox.textContent = '❌ حدث خطأ أثناء استخراج البوستر.';
                btn.disabled = false;
                loader.style.display = 'none';
            }
        }
    </script>
    <script src="/js/layout.js"></script>
</body>
</html>
