<!DOCTYPE html>
<html lang="ar">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>⚙️ أرشيف التسجيلات</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .table-container { width: 100%; overflow-x: auto; background: white; border-radius: 12px; border: 1px solid #eee; margin-top: 20px; box-shadow: var(--box-shadow); }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { padding: 15px; text-align: right; border-bottom: 1px solid #eee; }
        th { background: #f8fafc; color: #334155; font-weight: bold; }
        tr:hover { background: #f1f5f9; }
        
        .badge { display: inline-block; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .badge-new { background: #d1fae5; color: #065f46; }
        .badge-old { background: #e0e7ff; color: #3730a3; }
        
        .status-badge { display: inline-block; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .status-approved { background: #dcfce7; color: #166534; }
        .status-rejected { background: #fee2e2; color: #991b1b; }
        
        .empty-state { text-align: center; padding: 40px; color: #64748b; font-size: 16px; }
    </style>
</head>
<body>

    <div class="card" style="padding: 25px;">
        <h3 style="margin-top:0; color:var(--primary); display:flex; align-items:center; gap:10px;">
            <span style="font-size:24px;">🗄️</span> أرشيف التسجيلات
        </h3>
        <p style="color:var(--text-muted); font-size:14px; margin-bottom:20px;">
            هذه القائمة تحتوي على طلبات التسجيل التي تمت الموافقة عليها أو رفضها بالفعل.
        </p>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <button onclick="fixEnrollments()" class="btn-bulk" style="background-color: var(--danger);">🛠️ إصلاح بيانات التجديد الخاطئة</button>
            <input type="text" id="searchInput" placeholder="🔍 بحث باسم الطالب..." onkeyup="filterArchiveTable()" style="padding: 10px; border-radius: 8px; border: 1px solid #ccc; width: 300px; font-family: inherit;">
        </div>

        <div id="statusBar" class="status-bar" style="margin-bottom:15px; display:none; padding:15px; border-radius:10px; text-align:center; font-weight:bold;"></div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>رقم الطلب</th>
                        <th>اسم الطالب</th>
                        <th>نوع الطلب</th>
                        <th>السن (المرحلة/الحكومي)</th>
                        <th>المبلغ المدفوع</th>
                        <th>الفصل</th>
                        <th>حالة الطلب</th>
                    </tr>
                </thead>
                <tbody id="requestsTableBody">
                    <tr>
                        <td colspan="7" class="empty-state">⏳ جاري تحميل الأرشيف...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        let archiveRequests = [];
        let filteredArchiveRequests = [];

        window.onload = async () => {
            requireRole('Admin', 'HeadSecretary');
            
            try {
                await loadArchiveRequests();
            } catch (e) {
                console.error("Error loading page data:", e);
                showStatus('statusBar', 'error', 'حدث خطأ في تحميل البيانات الأساسية');
            }
        };

        async function loadArchiveRequests() {
            const tbody = document.getElementById('requestsTableBody');
            
            try {
                const res = await fetchApi('/registrations/archive');
                if (res && res.success) {
                    archiveRequests = res.requests;
                    filteredArchiveRequests = [...archiveRequests];
                    renderRequests();
                } else {
                    tbody.innerHTML = `<tr><td colspan="7" class="empty-state" style="color:var(--danger);">❌ خطأ: ${res?.message || 'فشل تحميل الأرشيف'}</td></tr>`;
                }
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="7" class="empty-state" style="color:var(--danger);">❌ خطأ في الاتصال بالخادم</td></tr>`;
            }
        }

        async function fixEnrollments() {
            if (!confirm('هل أنت متأكد من تشغيل أمر إصلاح البيانات؟')) return;
            try {
                const res = await fetchApi('/registrations/fix-enrollments', 'POST');
                if (res && res.success) {
                    showStatus('statusBar', 'success', `✅ ${res.message}`);
                } else {
                    showStatus('statusBar', 'error', `❌ خطأ: ${res?.message || 'فشل إصلاح البيانات'}`);
                }
            } catch (e) {
                showStatus('statusBar', 'error', '❌ خطأ في الاتصال بالخادم');
            }
        }

        function filterArchiveTable() {
            const term = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!term) {
                filteredArchiveRequests = [...archiveRequests];
            } else {
                filteredArchiveRequests = archiveRequests.filter(r => r.name.toLowerCase().includes(term));
            }
            renderRequests();
        }

        function renderRequests() {
            const tbody = document.getElementById('requestsTableBody');
            
            if (filteredArchiveRequests.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty-state">✅ لا يوجد سجلات مطابقة للبحث حالياً</td></tr>';
                return;
            }

            let html = '';
            filteredArchiveRequests.forEach(req => {
                const typeBadge = req.isRenewal 
                    ? '<span class="badge badge-old">تجديد طالب قديم</span>' 
                    : '<span class="badge badge-new">طالب جديد</span>';
                
                const dateObj = new Date(req.requestDate);
                const dateStr = dateObj.toLocaleDateString('ar-EG') + ' ' + dateObj.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
                
                let statusBadge = '';
                if (req.status === 'Approved') {
                    statusBadge = '<span class="status-badge status-approved">✔️ تمت الموافقة</span>';
                } else if (req.status === 'Rejected') {
                    statusBadge = '<span class="status-badge status-rejected">❌ مرفوض</span>';
                } else {
                    statusBadge = `<span class="status-badge">${req.status}</span>`;
                }

                html += `
                    <tr>
                        <td style="color:#64748b; font-size:12px;">#${req.id}<br>${dateStr}</td>
                        <td style="font-weight:bold; color:var(--primary);">${req.name}</td>
                        <td>${typeBadge}</td>
                        <td>${req.govGrade || '-'}</td>
                        <td style="font-weight:bold; color:var(--success);">${req.amountPaid} ج.م</td>
                        <td>${req.className || '-'}</td>
                        <td style="text-align:center;">
                            ${statusBadge}
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }
    </script>
    <script src="/js/layout.js"></script>
</body>
</html>
