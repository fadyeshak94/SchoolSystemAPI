<!DOCTYPE html>
<html lang="ar">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>📅 تقرير الحضور والغياب</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .table-container { width: 100%; overflow-x: auto; background: white; border-radius: 12px; border: 1px solid #eee; margin-top: 20px; box-shadow: var(--box-shadow); }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { padding: 15px; text-align: center; border-bottom: 1px solid #eee; }
        th { background: #f8fafc; color: #334155; font-weight: bold; }
        tr:hover { background: #f1f5f9; }
        
        .year-header { background: var(--primary); color: white; font-weight: bold; font-size: 16px; text-align: center; }
        .text-right { text-align: right; }
        
        .badge { display: inline-block; padding: 5px 10px; border-radius: 6px; font-size: 13px; font-weight: bold; }
        .badge-success { background: #d1fae5; color: #065f46; }
        .badge-danger { background: #fee2e2; color: #991b1b; }
        
        .empty-state { text-align: center; padding: 40px; color: #64748b; font-size: 16px; }
    </style>
</head>
<body>

    <div class="card" style="padding: 25px;">
        <h3 style="margin-top:0; color:var(--primary); display:flex; align-items:center; gap:10px;">
            <span style="font-size:24px;">📅</span> تقرير الحضور والغياب لكل جمعة
        </h3>
        <p style="color:var(--text-muted); font-size:14px; margin-bottom:20px;">
            يعرض هذا التقرير تجميعاً لسجلات الحضور والغياب في كل يوم جمعة مقسمة حسب السنة الدراسية.
        </p>

        <div id="statusBar" class="status-bar" style="margin-bottom:15px; display:none; padding:15px; border-radius:10px; text-align:center; font-weight:bold;"></div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th class="text-right">التاريخ (يوم الجمعة)</th>
                        <th>إجمالي المقيدين هذا اليوم</th>
                        <th>عدد الحضور</th>
                        <th>نسبة الحضور</th>
                        <th>عدد الغياب</th>
                        <th>نسبة الغياب</th>
                    </tr>
                </thead>
                <tbody id="reportTableBody">
                    <tr>
                        <td colspan="6" class="empty-state">⏳ جاري تحميل التقرير...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        window.onload = async () => {
            requireRole('Admin');
            await loadReport();
        };

        async function loadReport() {
            const tbody = document.getElementById('reportTableBody');
            try {
                const res = await fetchApi('/reports/attendance');
                if (res && res.success) {
                    renderReport(res.reports);
                } else {
                    tbody.innerHTML = `<tr><td colspan="6" class="empty-state" style="color:var(--danger);">❌ خطأ: ${res?.message || 'فشل تحميل التقرير'}</td></tr>`;
                }
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="6" class="empty-state" style="color:var(--danger);">❌ خطأ في الاتصال بالخادم</td></tr>`;
            }
        }

        function renderReport(reports) {
            const tbody = document.getElementById('reportTableBody');
            
            if (!reports || reports.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-state">✅ لا توجد سجلات غياب محفوظة لعرضها</td></tr>';
                return;
            }

            let html = '';
            let currentYear = '';

            reports.forEach(r => {
                if (r.academicYear !== currentYear) {
                    html += `<tr><td colspan="6" class="year-header">السنة الدراسية: ${r.academicYear || 'غير محدد'}</td></tr>`;
                    currentYear = r.academicYear;
                }

                html += `
                    <tr>
                        <td class="text-right" style="font-weight:bold; color:var(--primary);">${r.date}</td>
                        <td style="font-weight:bold;">${r.totalStudents}</td>
                        <td style="color:var(--success); font-weight:bold;">${r.presentCount}</td>
                        <td><span class="badge badge-success" dir="ltr">${r.presentPercentage}%</span></td>
                        <td style="color:var(--danger); font-weight:bold;">${r.absentCount}</td>
                        <td><span class="badge badge-danger" dir="ltr">${r.absentPercentage}%</span></td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }
    </script>
    <script src="/js/layout.js"></script>
</body>
</html>
