<!DOCTYPE html>
<html lang="ar">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>🗓️ تسجيل الغياب</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .student-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            margin-bottom: 12px;
            border-radius: 12px;
            background: white;
            border: 2px solid transparent;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .student-card.present {
            background-color: #d1fae5;
            border-color: #10b981;
        }
        .student-card.absent {
            background-color: #fee2e2;
            border-color: #ef4444;
        }
        .student-card .student-name {
            font-size: 17px;
            font-weight: bold;
            color: #333;
        }
        .student-card.present .student-name { color: #065f46; }
        .student-card.absent .student-name { color: #991b1b; }
        
        .student-card .status-icon {
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
        }
        
        .student-card.disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    
    
    <div id="statusBar" class="status-bar"></div>

    <div class="controls">
        <select id="classSelect"></select>
        <input type="date" id="dateInput">
        <button class="btn btn-primary" onclick="loadAttendance()">📋 تحميل الطلاب</button>
        <button class="btn btn-success" id="saveBtn" onclick="saveAttendance()" style="display:none; margin-right:auto;">💾 حفظ الغياب</button>
    </div>

    <div id="content" class="table-container"></div>

    <script src="/js/app.js"></script>
    <script>
        let currentTerm = "1";
        let currentYear = "2026-2027";

        window.onload = async () => {
            loadClassesDropdown('classSelect');
            
            // جلب الإعدادات (التيرم والسنة)
            const settings = await fetchApi('/settings');
            if (settings) {
                currentTerm = settings.currentTerm || "1";
                currentYear = settings.academicYear || "2026-2027";
            }

            // منع اختيار أيام غير الجمعة
            document.getElementById('dateInput').addEventListener('change', function() {
                if (this.value) {
                    const day = new Date(this.value).getDay();
                    if (day !== 5) {
                        showStatus('statusBar', 'error', 'عفواً، يمكن تسجيل الغياب لأيام الجمعة فقط');
                        this.value = '';
                    }
                }
            });
        };

        async function loadAttendance() {
            const classId = document.getElementById('classSelect').value;
            const dateStr = document.getElementById('dateInput').value;
            if (!classId || !dateStr) return showStatus('statusBar', 'error', 'يرجى اختيار الفصل والتاريخ');

            document.getElementById('content').innerHTML = '<div class="spinner"></div>';
            document.getElementById('saveBtn').style.display = 'none';

            const res = await fetchApi(`/attendance/entry?classId=${classId}&date=${dateStr}`);
            if (!res || !res.students) return;

            const token = localStorage.getItem('appToken');
            const payload = parseJwtToken(token);
            let rawRole = payload["http://schemas.microsoft.com/ws/2008/06/identity/claims/role"] || payload.role || payload.Role || "User";
            const userRole = Array.isArray(rawRole) ? rawRole[0] : rawRole;
            const isServant = (userRole === "Servant");

            if(res.alreadyRecorded) showStatus('statusBar', 'info', 'الغياب مسجل مسبقاً، أي تعديل سيحدث السجل.');

            let html = '<div class="students-list" style="max-width: 600px; margin: 0 auto; padding-bottom: 30px;">';
            html += '<p style="text-align:center; color:#666; margin-bottom:15px; font-size:14px;">اضغط على اسم الطالب لتغيير حالة الغياب</p>';
            res.students.forEach(s => {
                const isAbsent = s.status === 'Absent';
                const statusClass = isAbsent ? 'absent' : 'present';
                const icon = isAbsent ? '❌' : '✅';
                const disabledClass = isServant ? 'disabled' : '';
                const clickHandler = isServant ? '' : 'onclick="toggleStatus(this)"';
                
                html += `
                <div class="student-card ${statusClass} ${disabledClass}" data-id="${s.id}" data-status="${isAbsent ? 'Absent' : 'Present'}" ${clickHandler}>
                    <div class="student-name">${s.name}</div>
                    <div class="status-icon">${icon}</div>
                </div>`;
            });
            html += '</div>';
            
            document.getElementById('content').innerHTML = html;
            if (res.students.length > 0 && !isServant) {
                document.getElementById('saveBtn').style.display = 'inline-flex';
            }
        }

        function toggleStatus(card) {
            if (card.classList.contains('disabled')) return;
            
            if (card.dataset.status === 'Present') {
                card.dataset.status = 'Absent';
                card.classList.remove('present');
                card.classList.add('absent');
                card.querySelector('.status-icon').innerText = '❌';
            } else {
                card.dataset.status = 'Present';
                card.classList.remove('absent');
                card.classList.add('present');
                card.querySelector('.status-icon').innerText = '✅';
            }
        }

        async function saveAttendance() {
            const records = [];
            document.querySelectorAll('.student-card').forEach(card => {
                records.push({ studentId: parseInt(card.dataset.id), status: card.dataset.status });
            });

            const payload = {
                classId: parseInt(document.getElementById('classSelect').value),
                date: document.getElementById('dateInput').value,
                term: currentTerm,
                academicYear: currentYear,
                records: records
            };

            const btn = document.getElementById('saveBtn');
            btn.disabled = true;

            const res = await fetchApi('/attendance/entry/save', 'POST', payload);
            btn.disabled = false;

            if (res && res.success) showStatus('statusBar', 'success', res.message);
            else showStatus('statusBar', 'error', res?.message || 'خطأ في الحفظ');
        }
    </script>
    <script src="/js/layout.js"></script>
  </body>
</html>
