<!DOCTYPE html>
<html lang="ar">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>📊 تقرير التحصيل اليومي</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .table-container { width: 100%; overflow-x: auto; background: white; border-radius: 12px; border: 1px solid #eee; margin-top: 20px; box-shadow: var(--box-shadow); }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 15px; text-align: right; border-bottom: 1px solid #eee; }
        th { background: #f8fafc; color: #334155; font-weight: bold; }
        tr:hover { background: #f1f5f9; }
        
        .search-box { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; align-items: flex-end; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        .filter-group label { font-weight: bold; font-size: 13px; color: #555; }
        .search-box input { padding: 10px; border: 1px solid #ccc; border-radius: 8px; min-width: 150px; font-family: inherit; }
        .btn-search { padding: 10px 20px; background: #3b82f6; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; height: 40px; }
        
        .summary-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .summary-card { background: white; padding: 20px; border-radius: 12px; border: 1px solid #eee; box-shadow: var(--box-shadow); text-align: center; }
        .summary-card h4 { margin: 0 0 10px 0; color: #64748b; font-size: 14px; }
        .summary-card .value { font-size: 24px; font-weight: bold; color: var(--success); }
        
        .empty-state { text-align: center; padding: 40px; color: #64748b; font-size: 16px; }
    </style>
</head>
<body>
    <div class="card" style="padding: 25px;">
        <h3 style="margin-top:0; color:var(--primary); display:flex; align-items:center; gap:10px;">
            <span style="font-size:24px;">📊</span> تقرير التحصيل اليومي
        </h3>
        <p style="color:var(--text-muted); font-size:14px; margin-bottom:20px;">
            يعرض هذا التقرير إجمالي الأموال التي تم تحصيلها مجمعة حسب اليوم. يمكنك الفلترة لتحديد فترة معينة.
        </p>

        <div id="statusBar" class="status-bar" style="margin-bottom:15px; display:none; padding:15px; border-radius:10px; text-align:center; font-weight:bold;"></div>

        <div class="search-box">
            <div class="filter-group">
                <label>من تاريخ</label>
                <input type="date" id="fromDate">
            </div>
            <div class="filter-group">
                <label>إلى تاريخ</label>
                <input type="date" id="toDate">
            </div>
            <button class="btn-search" onclick="loadRevenue()">🔄 بحث وتحديث</button>
        </div>

        <div class="summary-cards" id="summaryCards" style="display:none;">
            <div class="summary-card">
                <h4>إجمالي التحصيل للفترة المحددة</h4>
                <div class="value" id="totalCollected">0 ج.م</div>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>اليوم / التاريخ</th>
                        <th>إجمالي المبلغ المحصل</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="2" class="empty-state">جاري التحميل...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        window.onload = () => {
            requireRole('Admin', 'HeadSecretary');
            
            // Set default date range (this month)
            const today = new Date();
            const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
            
            document.getElementById('fromDate').value = firstDay.toISOString().split('T')[0];
            document.getElementById('toDate').value = today.toISOString().split('T')[0];

            loadRevenue();
        };

        async function loadRevenue() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '<tr><td colspan="2" class="empty-state">جاري التحميل...</td></tr>';
            
            const from = document.getElementById('fromDate').value;
            const to = document.getElementById('toDate').value;
            
            try {
                let url = '/reports/daily-revenue';
                let params = [];
                if(from) params.push(`from=${from}`);
                if(to) params.push(`to=${to}`);
                if(params.length > 0) url += '?' + params.join('&');

                const res = await fetchApi(url);
                if (res && res.success) {
                    renderData(res.data);
                } else {
                    tbody.innerHTML = `<tr><td colspan="2" class="empty-state" style="color:var(--danger);">❌ خطأ في تحميل البيانات</td></tr>`;
                }
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="2" class="empty-state" style="color:var(--danger);">❌ خطأ في الاتصال بالخادم</td></tr>`;
            }
        }

        function renderData(data) {
            const tbody = document.getElementById('tableBody');
            let total = 0;

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="2" class="empty-state">لا توجد مبالغ محصلة في هذه الفترة</td></tr>';
                document.getElementById('totalCollected').textContent = '0 ج.م';
                document.getElementById('summaryCards').style.display = 'grid';
                return;
            }

            let html = '';
            data.forEach(item => {
                total += parseFloat(item.totalAmount || 0);
                
                // Format date nice
                const dateObj = new Date(item.date);
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                const formattedDate = dateObj.toLocaleDateString('ar-EG', options);

                html += `
                    <tr>
                        <td style="font-weight:bold; color:var(--primary);">${formattedDate}</td>
                        <td style="color:var(--success); font-weight:bold; font-size:16px;">${item.totalAmount} ج.م</td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
            
            document.getElementById('totalCollected').textContent = total.toLocaleString('en-US') + ' ج.م';
            document.getElementById('summaryCards').style.display = 'grid';
        }
    </script>
    <script src="/js/layout.js"></script>
</body>
</html>
