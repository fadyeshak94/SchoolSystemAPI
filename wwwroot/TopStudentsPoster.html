<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>🏆 بوستر الأوائل</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
    <style>
        body { direction: rtl; padding: 20px; font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; }
        .card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; text-align: right; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        select { width: 100%; max-width: 400px; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 15px; }
        .btn { padding: 12px 25px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-primary { background: #10b981; color: white; }
        .btn-primary:hover { background: #059669; }
        .loading { display: none; margin-top: 15px; color: #047857; font-weight: bold; }
        
        /* Grid for Student Image Uploads */
        .students-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; margin-top: 20px; }
        .student-upload-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; text-align: center; position: relative; }
        .rank-badge { position: absolute; top: 10px; right: 10px; background: #fbbf24; color: #78350f; font-weight: bold; padding: 3px 8px; border-radius: 6px; font-size: 12px; }
        .student-upload-card h4 { margin: 10px 0; color: #1e293b; font-size: 16px; }
        .student-upload-card p { margin: 0 0 15px 0; color: #64748b; font-size: 13px; font-weight: bold; }
        .image-preview { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin: 0 auto 10px auto; border: 3px solid #cbd5e1; display: block; background: #e2e8f0; }
        
        .status-box { margin-top:20px; padding:15px; border-radius:10px; display:none; font-weight:bold; text-align:center; }
        .status-success { background:#e6f4ea; color:#0d652d; border:1px solid #ceead6; display:block; }
        .status-error { background:#fce8e6; color:#d93025; border:1px solid #fad2cf; display:block; }
    </style>
</head>
<body>

    <div class="card">
        <h3 style="margin-top:0; color:var(--primary); display:flex; align-items:center; gap:10px;">
            <span style="font-size:24px;">🏆</span> إعداد بوستر الأوائل
        </h3>
        <p style="color:var(--text-muted); font-size:14px; margin-bottom:20px;">
            اختر الفصل لجلب الأوائل (أول 3 مراكز مع المكررين). ثم قم بإرفاق صورهم لاستخراج البوستر.
        </p>

        <div class="form-group">
            <select id="classSelect" onchange="loadTopStudents()">
                <option value="">جاري التحميل...</option>
            </select>
        </div>

        <div id="studentsContainer" style="display:none; margin-top: 30px;">
            <h4 style="border-bottom: 2px solid #eee; padding-bottom: 10px;">👤 إرفاق صور الأوائل</h4>
            <div class="students-grid" id="studentsGrid"></div>
            
            <button class="btn btn-primary" onclick="generatePoster()" id="genBtn" style="width: 100%; margin-top: 25px;">
                🖼️ استخراج البوستر (صورة PNG)
            </button>
        </div>
        
        <div id="loading" class="loading">⏳ جاري المعالجة وإعداد الصورة... الرجاء الانتظار.</div>
        <div id="statusBox" class="status-box"></div>
    </div>

    <!-- Hidden Poster Layout template -->
    <div id="posterTemplate" style="display: none;"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/logos.js"></script>
    <script>
        let classMap = {};
        let topStudentsData = []; // Array of { student, rank, rankName, imageSrc }
        let selectedClassInfo = null;

        window.onload = async () => {
            requireRole('Admin', 'HeadSecretary', 'StageSupervisor', 'User'); 
            try {
                const data = await fetchApi('/users/me/classes');
                const select = document.getElementById('classSelect');
                select.innerHTML = '<option value="">-- اختر الفصل --</option>';
                
                if (data && data.classes && data.classes.length > 0) {
                    let lastStage = null;
                    data.classes.forEach(c => {
                        classMap[c.id] = c;
                        if (c.stage !== lastStage) {
                            let group = document.createElement('optgroup');
                            group.label = c.stage;
                            select.appendChild(group);
                            lastStage = c.stage;
                        }
                        let opt = document.createElement('option');
                        opt.value = c.id;
                        opt.textContent = c.name + (c.year ? ' (' + c.year + ')' : '');
                        select.lastChild.appendChild(opt);
                    });
                } else {
                    select.innerHTML = '<option value="">لا يوجد فصول متاحة</option>';
                }
            } catch (e) {
                console.error(e);
                document.getElementById('classSelect').innerHTML = '<option value="">خطأ في التحميل</option>';
            }
        };

        async function loadTopStudents() {
            const classId = document.getElementById('classSelect').value;
            const container = document.getElementById('studentsContainer');
            const grid = document.getElementById('studentsGrid');
            const statusBox = document.getElementById('statusBox');
            
            container.style.display = 'none';
            statusBox.style.display = 'none';
            topStudentsData = [];

            if (!classId) return;
            selectedClassInfo = classMap[classId];

            statusBox.style.display = 'block';
            statusBox.className = 'status-box';
            statusBox.style.background = '#e0f2fe';
            statusBox.style.color = '#0369a1';
            statusBox.textContent = '⏳ جاري جلب النتيجة وتحديد الأوائل...';

            try {
                const response = await fetchApi(`/results/class/${classId}?term=all&subject=all`);
                if (!response || !response.success || !response.students || response.students.length === 0) {
                    throw new Error('لا يوجد نتائج لهذا الفصل.');
                }

                // Filter out failures (less than 50%)
                const passedStudents = response.students.filter(s => s.percentage >= 50);
                if(passedStudents.length === 0) throw new Error('لا يوجد طلاب ناجحين في هذا الفصل.');

                // Group by total score ignoring half-marks (Math.floor)
                const scoresMap = new Map();
                passedStudents.forEach(s => {
                    const score = Math.floor(s.total).toString();
                    if(!scoresMap.has(score)) scoresMap.set(score, []);
                    scoresMap.get(score).push(s);
                });

                // Sort scores descending
                const sortedScores = Array.from(scoresMap.keys()).sort((a,b) => parseFloat(b) - parseFloat(a));

                // Take top 6 scores (allowing user to override/delete ranks manually)
                const top6Scores = sortedScores.slice(0, 6);
                if(top6Scores.length === 0) throw new Error('لم يتم العثور على درجات.');

                const rankNames = ['المركز الأول', 'المركز الثاني', 'المركز الثالث', 'المركز الرابع', 'المركز الخامس', 'المركز السادس'];
                let rankColors = ['#f59e0b', '#94a3b8', '#b45309', '#0ea5e9', '#8b5cf6', '#ec4899'];

                let html = '';
                top6Scores.forEach((score, index) => {
                    const rankStudents = scoresMap.get(score);
                    rankStudents.forEach(student => {
                        // Store in our array
                        const stuObj = {
                            student: student,
                            rank: index + 1,
                            rankName: rankNames[index] + (rankStudents.length > 1 ? ' مكرر' : ''),
                            color: rankColors[index],
                            imageSrc: '/images/default_avatar.png'
                        };
                        topStudentsData.push(stuObj);
                        
                        html += `
                            <div class="student-upload-card" id="student_card_${student.id}">
                                <div style="margin-bottom: 5px;">
                                    <input type="text" id="rank_input_${student.id}" value="${stuObj.rankName}" style="text-align: center; font-weight: bold; padding: 4px; border: 1px solid #cbd5e1; border-radius: 5px; width: 90%; background-color: ${stuObj.color}; color: white; font-size: 12px;">
                                </div>
                                <img src="/images/default_avatar.png" class="image-preview" id="preview_${student.id}">
                                <h4>${student.name}</h4>
                                <p>النسبة: ${student.percentage.toFixed(1)}% | الدرجة: ${student.total}</p>
                                <input type="file" accept="image/*" onchange="handleImageUpload(this, ${student.id})" style="font-size: 12px; max-width: 100%; margin-bottom: 10px;">
                                <button type="button" onclick="document.getElementById('student_card_${student.id}').remove()" style="background: #ef4444; color: white; border: none; border-radius: 5px; padding: 4px 10px; cursor: pointer; width: 100%; font-size: 12px;">❌ استبعاد من البوستر</button>
                            </div>
                        `;
                    });
                });

                grid.innerHTML = html;
                container.style.display = 'block';
                statusBox.style.display = 'none';

            } catch (e) {
                statusBox.className = 'status-box status-error';
                statusBox.textContent = e.message || 'حدث خطأ أثناء جلب النتائج.';
            }
        }

        function handleImageUpload(input, studentId) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    const dataUrl = e.target.result;
                    document.getElementById(`preview_${studentId}`).src = dataUrl;
                    // Update array
                    const stu = topStudentsData.find(s => s.student.id === studentId);
                    if(stu) stu.imageSrc = dataUrl;
                }
                reader.readAsDataURL(file);
            }
        }

        async function generatePoster() {
            var classId = document.getElementById('classSelect').value;
            var btn = document.getElementById('genBtn');
            var loader = document.getElementById('loading');
            var statusBox = document.getElementById('statusBox');

            btn.disabled = true;
            loader.style.display = 'block';
            statusBox.style.display = 'none';

            try {
                let logoSch = typeof LOGO_SCHOOL_BASE64 !== 'undefined' ? LOGO_SCHOOL_BASE64 : '';
                let logoDio = typeof LOGO_DIOCESE_BASE64 !== 'undefined' ? LOGO_DIOCESE_BASE64 : '';
                
                let stageText = selectedClassInfo && selectedClassInfo.stage ? selectedClassInfo.stage : '';
                let yearText = selectedClassInfo && selectedClassInfo.year ? selectedClassInfo.year : '';
                let className = selectedClassInfo && selectedClassInfo.name ? selectedClassInfo.name : '';
                
                const titleText = `أوائل السنة ${yearText} من مرحلة ${stageText} - فصل ${className}`;

                // Rebuild active students from DOM to capture manual edits and deletions
                let activeStudents = [];
                topStudentsData.forEach(s => {
                    const card = document.getElementById('student_card_' + s.student.id);
                    if (card) {
                        const newRankName = document.getElementById('rank_input_' + s.student.id).value;
                        s.rankName = newRankName;
                        activeStudents.push(s);
                    }
                });

                // Build Single Row for All Active Students
                let studentsHtml = '';
                activeStudents.forEach(s => {
                    // Default: Huge sizes so exactly 3 cards fit per row (wrap after 3)
                    let cardWidth = '400px';
                    let picSize = '280px';
                    let nameSize = '36px';

                    // If exactly 4 students, scale down slightly so all 4 fit in a single row
                    if (activeStudents.length === 4) {
                        cardWidth = '320px';
                        picSize = '240px';
                        nameSize = '32px';
                    }

                    studentsHtml += `
                        <div style="width: ${cardWidth}; text-align: center; margin: 15px; background: white; border: 2px solid ${s.color}; border-radius: 15px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); position: relative; z-index: 2;">
                            <div style="background: ${s.color}; color: white; border-radius: 20px; padding: 6px 15px; font-weight: bold; font-size: 18px; margin-bottom: 15px; display: inline-block;">${s.rankName}</div>
                            <img src="${s.imageSrc}" style="width: ${picSize}; height: ${picSize}; border-radius: 50%; object-fit: cover; border: 4px solid #fdf8ec; display: block; margin: 0 auto 15px auto;">
                            <div style="font-family: 'Aref Ruqaa', serif; font-size: ${nameSize}; color: #1a2744; font-weight: bold; line-height: 1.3; min-height: 50px;">${s.student.name}</div>
                            <div style="margin-top: 10px; font-size: 20px; color: #7a1f1f; font-weight: bold;">${s.student.percentage.toFixed(1)}%</div>
                        </div>
                    `;
                });

                let rowsHtml = `
                    <div style="display: flex; flex-wrap: wrap; justify-content: center; align-items: center; width: 100%; position: relative; z-index: 2;">
                        ${studentsHtml}
                    </div>
                `;

                let pageHtml = `
                    <div style="font-family:'Segoe UI', Tahoma, sans-serif; text-align:center; direction:rtl; padding:0; width: 1587px; min-height: 1122px; box-sizing: border-box; background: white; display: flex; flex-direction: column;">
                        <div style="padding: 50px; margin: 0; background: #fdf8ec; min-height: 1122px; box-sizing: border-box; display: flex; flex-direction: column; flex: 1;">
                            <div style="border: 12px double #c9a227; padding: 8px; box-sizing: border-box; background: white; flex: 1; display: flex; flex-direction: column;">
                                <div style="border: 2px solid #c9a227; padding: 15px; position: relative; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; box-sizing: border-box; background: #fdf8ec; flex: 1;">
                                    
                                    <!-- Logos -->
                                    <div style="position:absolute; top:25px; right:45px; z-index: 2;">
                                        <img src="data:image/png;base64,${logoDio}" style="width:135px; height:135px; object-fit:contain;" onerror="this.style.display='none'">
                                    </div>
                                    <div style="position:absolute; top:25px; left: 50%; transform: translateX(-50%); z-index: 2;">
                                        <img src="/images/cross.png" style="width:135px; height:135px; object-fit:contain;" onerror="this.style.display='none'">
                                    </div>
                                    <div style="position:absolute; top:25px; left:45px; z-index: 2;">
                                        <img src="/images/Logo.png" style="width:135px; height:135px; object-fit:contain; border-radius: 50%; background-color: white; padding: 5px;" onerror="this.style.display='none'">
                                    </div>
                                    
                                    <!-- Watermark -->
                                    <div style="position:absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); opacity: 0.05; z-index: 0; pointer-events: none;">
                                        <img src="/images/Logo.png" style="width:750px; height:750px; object-fit:contain;" onerror="this.style.display='none'">
                                    </div>
                                    
                                    <!-- Title -->
                                    <h1 style="font-family: 'Aref Ruqaa', serif; color:#1a2744; font-size:90px; margin-bottom:5px; margin-top:140px; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); position: relative; z-index: 2;">لوحة شرف الأوائل</h1>
                                    <p style="font-size:36px; font-weight: bold; color:#7a1f1f; margin-top: 5px; margin-bottom: 40px; position: relative; z-index: 2;">
                                        ${titleText}
                                    </p>
                                    
                                    <!-- Pyramid Rows -->
                                    <div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-start; flex: 1; width: 100%;">
                                        ${rowsHtml}
                                    </div>
                                    
                                    <!-- Verse -->
                                    <div style="margin-top: auto; padding-bottom: 30px; position: relative; z-index: 2;">
                                        <p style="font-family: 'Aref Ruqaa', serif; font-size:40px; color:#1a2744; margin: 0; line-height: 1.5;">
                                            "أَيُّهَا الْحَبِيبُ، فِي كُلِّ شَيْءٍ أَرُومُ أَنْ تَكُونَ نَاجِحًا وَصَحِيحًا، كَمَا أَنَّ نَفْسَكَ نَاجِحَةٌ."
                                        </p>
                                        <p style="font-family: 'Aref Ruqaa', serif; font-size: 28px; color: #7a1f1f; margin: 5px 0 0 0;">
                                            (رسالة يوحنا الرسول الثالثة 1: 2)
                                        </p>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </div>
                `;

                let tempContainer = document.createElement('div');
                tempContainer.innerHTML = pageHtml;
                tempContainer.style.position = 'absolute';
                tempContainer.style.top = '-9999px';
                tempContainer.style.left = '-9999px';
                document.body.appendChild(tempContainer);

                let captureEl = tempContainer.children[0];

                html2canvas(captureEl, { scale: 2, useCORS: true }).then(canvas => {
                    let link = document.createElement('a');
                    link.download = 'Top_Students_' + classId + '.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    
                    document.body.removeChild(tempContainer);
                    
                    statusBox.style.display = 'block';
                    statusBox.className = 'status-box status-success';
                    statusBox.textContent = '✅ تم تحميل صورة الأوائل بنجاح!';
                    
                    btn.disabled = false;
                    loader.style.display = 'none';
                });
                
            } catch (e) {
                console.error(e);
                statusBox.style.display = 'block';
                statusBox.className = 'status-box status-error';
                statusBox.textContent = '❌ حدث خطأ أثناء استخراج البوستر.';
            }
        }
    </script>
    <script src="/js/layout.js"></script>
</body>
</html>
