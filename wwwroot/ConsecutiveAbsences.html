<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>الغياب المتكرر (المنقطعين) 📉</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="controls">
        <label>ابحث عن من غاب متتالياً لعدد أيام (أو أكثر):</label>
        <input type="number" id="threshold" value="2" min="2" style="max-width: 150px;">
        <button class="btn btn-primary" onclick="loadConsecutiveAbsences()">بحث</button>
        <button class="btn btn-success" onclick="window.print()">🖨️ طباعة</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>كود الطالب</th>
                    <th>اسم الطالب</th>
                    <th>الفصل</th>
                    <th>عدد مرات الغياب المتتالية (أقصى)</th>
                    <th>تواريخ آخر غيابات متتالية</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody id="absencesTable">
                <tr><td colspan="6"><div class="spinner" style="margin: 20px auto;"></div></td></tr>
            </tbody>
        </table>
    </div>

    <script src="/js/app.js"></script>
    <script>
        async function loadConsecutiveAbsences() {
            const threshold = parseInt(document.getElementById('threshold').value) || 2;
            
            document.getElementById('absencesTable').innerHTML = `<tr><td colspan="6"><div class="spinner" style="margin: 20px auto;"></div></td></tr>`;

            const res = await fetchApi(`/Reports/consecutive-absences?threshold=${threshold}`);
            if (!res || !res.success) {
                document.getElementById('absencesTable').innerHTML = `<tr><td colspan="6" style="color:red;">حدث خطأ في جلب البيانات</td></tr>`;
                return;
            }

            let html = "";
            res.data.forEach(st => {
                let riskClass = st.consecutiveAbsencesCount > 3 ? "risk-high" : "risk-medium";
                if(st.consecutiveAbsencesCount > 3) {
                     riskClass = "style='background-color: #fee2e2; color: #991b1b;'";
                } else {
                     riskClass = "style='background-color: #fef3c7; color: #92400e;'";
                }

                html += `<tr ${riskClass}>
                    <td style="font-weight:bold;">${st.studentId}</td>
                    <td style="font-weight:bold;">${st.studentName}</td>
                    <td>${st.className}</td>
                    <td style="font-weight:bold; font-size:18px;">${st.consecutiveAbsencesCount} أيام</td>
                    <td style="font-size:13px; direction:ltr; text-align:right;">${(st.lastAbsenceDates || []).join(' , ')}</td>
                    <td>
                        <a href="/StudentComprehensiveProfile.html?id=${st.studentId}" class="btn" style="background:var(--primary); color:white; padding:5px 10px; font-size:12px;">عرض الملف</a>
                    </td>
                </tr>`;
            });
            document.getElementById('absencesTable').innerHTML = html || `<tr><td colspan="6">لا يوجد طلاب مطابقين. (لا يوجد غياب متكرر متتالي)</td></tr>`;
        }
        
        window.onload = () => loadConsecutiveAbsences();
    </script>
    <script src="/js/layout.js"></script>
</body>
</html>
