<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>🎓 شهادات التقدير</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
      body { direction: rtl; padding: 20px; font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; }
      .header { background: linear-gradient(135deg, #10b981, #047857); color: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
      .card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; }
      .form-group { margin-bottom: 20px; text-align: right; }
      label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
      select { width: 100%; max-width: 400px; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 15px; }
      .btn { padding: 12px 25px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
      .btn-primary { background: #10b981; color: white; }
      .btn-primary:hover { background: #059669; }
      .loading { display: none; margin-top: 15px; color: #047857; font-weight: bold; }
      .back-btn { background:#e8eaed; border:none; padding:8px 20px; border-radius:10px; cursor:pointer; font-size:14px; margin-bottom:15px; }
      .status-box { margin-top:20px; padding:15px; border-radius:10px; display:none; font-weight:bold; }
      .status-success { background:#e6f4ea; color:#0d652d; border:1px solid #ceead6; display:block; }
      .status-error { background:#fce8e6; color:#d93025; border:1px solid #fad2cf; display:block; }
    </style>
  </head>
  <body>
    
    

    <div class="card">
      <div class="form-group">
        <label>اختر الفصل لاستخراج شهادات الناجحين:</label>
        <select id="classSelect">
          <option value="">جاري التحميل...</option>
        </select>
      </div>
      
      <button class="btn btn-primary" onclick="generateCerts()" id="genBtn">📄 استخراج الشهادات</button>
      
      <div id="loading" class="loading">⏳ جاري معالجة الشهادات وإعداد ملف الـ PDF... الرجاء الانتظار.</div>
      <div id="statusBox" class="status-box"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/logos.js"></script>
    <script>
      let classMap = {};

      window.onload = async () => {
        requireRole('Admin', 'User'); 
        try {
            const data = await fetchApi('/users/me/classes');
            const select = document.getElementById('classSelect');
            select.innerHTML = '';
            
            if (data && data.classes && data.classes.length > 0) {
                let lastStage = null;
                data.classes.forEach(c => {
                    classMap[c.id] = c;
                    if (c.stage !== lastStage) {
                        let group = document.createElement('optgroup');
                        group.label = c.stage;
                        select.appendChild(group);
                        lastStage = c.stage;
                    }
                    let opt = document.createElement('option');
                    opt.value = c.id;
                    opt.textContent = c.name + (c.year ? ' (' + c.year + ')' : '');
                    select.lastChild.appendChild(opt);
                });
            } else {
                select.innerHTML = '<option value="">لا يوجد فصول متاحة</option>';
            }
        } catch (e) {
            console.error(e);
            document.getElementById('classSelect').innerHTML = '<option value="">خطأ في التحميل</option>';
        }
      };

      async function generateCerts() {
        var classId = document.getElementById('classSelect').value;
        if (!classId) return;

        var btn = document.getElementById('genBtn');
        var loader = document.getElementById('loading');
        var statusBox = document.getElementById('statusBox');

        btn.disabled = true;
        loader.style.display = 'block';
        statusBox.style.display = 'none';

        try {
            // Fetch results
            const response = await fetchApi(`/results/class/${classId}?term=all&subject=all`);
            if (response && response.success && response.students) {
                let certHtml = '<div style="font-family:\'Segoe UI\', Tahoma, sans-serif; text-align:center; direction:rtl; padding:20px;">';
                let count = 0;
                
                const classInfo = classMap[classId];

                response.students.forEach((s, idx) => {
                    if (s.percentage >= 50) { // Assuming 50% is passing
                        count++;
                        let gradeTier = getTier(s.percentage);
                        let logoSch = typeof LOGO_SCHOOL_BASE64 !== 'undefined' ? LOGO_SCHOOL_BASE64 : '';
                        let logoDio = typeof LOGO_DIOCESE_BASE64 !== 'undefined' ? LOGO_DIOCESE_BASE64 : '';
                        
                        let stageText = classInfo && classInfo.stage ? classInfo.stage : '';
                        let yearText = classInfo && classInfo.year ? classInfo.year : '';
                        
                        // Build grades table horizontally
                        let theadRows = '';
                        let tbodyRows = '';
                        if (s.cols) {
                            for (let sub in s.cols) {
                                theadRows += `<th style="padding: 10px; border: 1px solid #ccc; background: #1e293b; color: white;">${sub}</th>`;
                                let scoreVal = typeof s.cols[sub] === 'object' ? s.cols[sub].total : s.cols[sub];
                                tbodyRows += `<td style="padding: 10px; border: 1px solid #ccc; background: #fdf8ec; color: #1e293b; font-weight: bold;">${scoreVal}</td>`;
                            }
                        }

                        certHtml += `
                            <div style="page-break-after: ${idx < response.students.length - 1 ? 'always' : 'auto'}; border: 4px solid #c9a227; outline: 1px solid #333; outline-offset: -8px; padding: 30px 40px; margin: 20px; background: #fdf8ec; position: relative; height: 720px; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; box-sizing: border-box;">
                                
                                <div style="position:absolute; top:25px; right:30px;">
                                    <img src="data:image/png;base64,${logoDio}" style="width:110px; height:110px; object-fit:contain;" onerror="this.style.display='none'">
                                </div>
                                <div style="position:absolute; top:25px; left:30px;">
                                    <img src="/images/Logo.png" style="width:110px; height:110px; object-fit:contain; border-radius: 50%; background-color: white; padding: 5px;" onerror="this.style.display='none'">
                                </div>
                                
                                <h1 style="color:#1a2744; font-size:42px; margin-bottom:10px; margin-top:5px; border-bottom: 3px solid #c9a227; padding-bottom: 5px; display: inline-block;">شهادة تقدير</h1>
                                
                                <p style="font-size:20px; color:#555; line-height: 1.6; text-align: center; margin-top: 10px; width: 70%;">
                                    يسٌر مدرسة القديس ديديموس للعلوم الكنسية بكنيسة الشهيد العظيم مارمينا والبابا كيرلس السادس بالخصوص أن
                                </p>
                                <p style="font-size:22px; color:#555; margin: 5px 0;">
                                    تهنئ الطالب<span> / </span>ة <strong style="color:#7a1f1f; font-size: 28px; margin: 0 5px;">${s.name}</strong>
                                </p>
                                <p style="font-size:22px; color:#555; margin-bottom: 20px;">
                                    على اجتياز السنة ${yearText} مرحلة ${stageText}
                                </p>
                                
                                <table style="border-collapse: collapse; width: 85%; margin: 0 auto 20px auto; font-size: 18px; text-align: center;">
                                    <thead>
                                        <tr>
                                            ${theadRows}
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            ${tbodyRows}
                                        </tr>
                                    </tbody>
                                </table>
                                
                                <div style="background: #fdfbf7; border: 2px solid #c9a227; border-radius: 12px; padding: 15px 20px; margin-bottom: 80px; font-size: 22px; color: #1a2744; font-weight: bold; width: 65%; display: flex; justify-content: space-around; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
                                    <span>الدرجة النهائية<span> : </span><span dir="ltr">${s.total}</span></span>
                                    <span>|</span>
                                    <span>النسبة<span> : </span><span dir="ltr">${s.percentage.toFixed(1)}%</span></span>
                                    <span>|</span>
                                    <span>التقدير<span> : </span>${gradeTier}</span>
                                </div>
                                
                                <div style="position:absolute; bottom:40px; right:80px; text-align:center;">
                                    <hr style="border: none; border-top: 2px solid #333; width: 160px; margin-bottom: 15px;">
                                    <p style="font-size:22px; font-weight:bold; color: #1a2744; margin: 0;">إدارة المدرسة</p>
                                </div>
                                <div style="position:absolute; bottom:40px; left:80px; text-align:center;">
                                    <hr style="border: none; border-top: 2px solid #333; width: 160px; margin-bottom: 15px;">
                                    <p style="font-size:22px; font-weight:bold; color: #1a2744; margin: 0;">الكنيسة</p>
                                </div>
                            </div>
                        `;
                    }
                });

                certHtml += '</div>';

                if (count === 0) {
                    throw new Error('لا يوجد طلاب ناجحين في هذا الفصل لاستخراج شهادات لهم.');
                }

                let container = document.createElement('div');
                container.innerHTML = certHtml;

                const opt = {
                    margin:       0,
                    filename:     'Certificates_Class_' + classId + '.pdf',
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { scale: 2 },
                    jsPDF:        { unit: 'px', format: [1122, 793], orientation: 'landscape' } // A4 Landscape roughly
                };

                await html2pdf().set(opt).from(container).save();

                statusBox.className = 'status-box status-success';
                statusBox.textContent = `✅ تم استخراج الشهادات بنجاح (${count} شهادة).`;
            } else {
                statusBox.className = 'status-box status-error';
                statusBox.textContent = '❌ خطأ: لم يتم العثور على نتائج للطلاب.';
            }
        } catch (err) {
            statusBox.className = 'status-box status-error';
            statusBox.textContent = '❌ ' + err.message;
        }

        btn.disabled = false;
        loader.style.display = 'none';
      }

      function getTier(pct) {
          if (pct >= 90) return 'ممتاز';
          if (pct >= 80) return 'جيد جداً';
          if (pct >= 65) return 'جيد';
          if (pct >= 50) return 'مقبول';
          return 'دون المستوى';
      }
    </script>
      <script src="/js/layout.js"></script>
  </body>
</html>
