<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>🎓 شهادات التقدير</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
    <style>
      body { direction: rtl; padding: 20px; font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; }
      .header { background: linear-gradient(135deg, #10b981, #047857); color: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
      .card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; }
      .form-group { margin-bottom: 20px; text-align: right; }
      label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
      select { width: 100%; max-width: 400px; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 15px; }
      .btn { padding: 12px 25px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
      .btn-primary { background: #10b981; color: white; }
      .btn-primary:hover { background: #059669; }
      .loading { display: none; margin-top: 15px; color: #047857; font-weight: bold; }
      .back-btn { background:#e8eaed; border:none; padding:8px 20px; border-radius:10px; cursor:pointer; font-size:14px; margin-bottom:15px; }
      .status-box { margin-top:20px; padding:15px; border-radius:10px; display:none; font-weight:bold; }
      .status-success { background:#e6f4ea; color:#0d652d; border:1px solid #ceead6; display:block; }
      .status-error { background:#fce8e6; color:#d93025; border:1px solid #fad2cf; display:block; }
    </style>
  </head>
  <body>
    
    

    <div class="card">
      <div class="form-group">
        <label>اختر الفصل لاستخراج شهادات الناجحين:</label>
        <select id="classSelect">
          <option value="">جاري التحميل...</option>
        </select>
      </div>
      
      <button class="btn btn-primary" onclick="generateCerts()" id="genBtn">📄 استخراج الشهادات</button>
      
      <div id="loading" class="loading">⏳ جاري معالجة الشهادات وإعداد ملف الـ PDF... الرجاء الانتظار.</div>
      <div id="statusBox" class="status-box"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/logos.js"></script>
    <script>
      let classMap = {};

      window.onload = async () => {
        requireRole('Admin', 'User'); 
        try {
            const data = await fetchApi('/users/me/classes');
            const select = document.getElementById('classSelect');
            select.innerHTML = '<option value="all">-- جميع الفصول (كل الناجحين) --</option>';
            
            if (data && data.classes && data.classes.length > 0) {
                let lastStage = null;
                data.classes.forEach(c => {
                    classMap[c.id] = c;
                    if (c.stage !== lastStage) {
                        let group = document.createElement('optgroup');
                        group.label = c.stage;
                        select.appendChild(group);
                        lastStage = c.stage;
                    }
                    let opt = document.createElement('option');
                    opt.value = c.id;
                    opt.textContent = c.name + (c.year ? ' (' + c.year + ')' : '');
                    select.lastChild.appendChild(opt);
                });
            } else {
                select.innerHTML = '<option value="">لا يوجد فصول متاحة</option>';
            }
        } catch (e) {
            console.error(e);
            document.getElementById('classSelect').innerHTML = '<option value="">خطأ في التحميل</option>';
        }
      };

      async function generateCerts() {
        var classId = document.getElementById('classSelect').value;
        if (!classId) return;

        var btn = document.getElementById('genBtn');
        var loader = document.getElementById('loading');
        var statusBox = document.getElementById('statusBox');

        btn.disabled = true;
        loader.style.display = 'block';
        statusBox.style.display = 'none';

        try {
            let classesToFetch = [];
            if (classId === 'all') {
                classesToFetch = Object.keys(classMap);
            } else {
                classesToFetch = [classId];
            }

            let allStudentsData = [];
            for (let cid of classesToFetch) {
                const response = await fetchApi(`/results/class/${cid}?term=all&subject=all`);
                if (response && response.success && response.students) {
                    response.students.forEach(s => {
                        if (s.percentage >= 50) {
                            allStudentsData.push({ s, classInfo: classMap[cid] });
                        }
                    });
                }
            }

            if (allStudentsData.length === 0) {
                throw new Error('لا يوجد طلاب ناجحين لاستخراج شهادات لهم.');
            }

            statusBox.style.display = 'block';
            statusBox.className = 'status-box status-success';
            statusBox.style.backgroundColor = '#fff3cd';
            statusBox.style.color = '#856404';
            statusBox.style.borderColor = '#ffeeba';
            statusBox.textContent = `⏳ جاري معالجة الشهادات (0 من ${Math.ceil(allStudentsData.length / 2)} صفحة)...`;

            let pages = [];
            for (let i = 0; i < allStudentsData.length; i += 2) {
                pages.push(allStudentsData.slice(i, i + 2));
            }

            const opt = {
                margin:       0,
                filename:     'Certificates_' + (classId === 'all' ? 'All_Classes' : 'Class_' + classId) + '.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'px', format: [1122, 1587], orientation: 'portrait' }
            };

            let worker = html2pdf().set(opt);

            for (let pIdx = 0; pIdx < pages.length; pIdx++) {
                let pageStudents = pages[pIdx];
                let pageHtml = '<div style="font-family:\'Segoe UI\', Tahoma, sans-serif; text-align:center; direction:rtl; padding:20px; width: 1122px; min-height: 1587px; box-sizing: border-box; background: white;">';
                
                pageStudents.forEach((data) => {
                    let s = data.s;
                    let classInfo = data.classInfo;
                    
                    let gradeTier = getTier(s.percentage);
                    let logoSch = typeof LOGO_SCHOOL_BASE64 !== 'undefined' ? LOGO_SCHOOL_BASE64 : '';
                    let logoDio = typeof LOGO_DIOCESE_BASE64 !== 'undefined' ? LOGO_DIOCESE_BASE64 : '';
                    
                    let stageText = classInfo && classInfo.stage ? classInfo.stage : '';
                    let yearText = classInfo && classInfo.year ? classInfo.year : '';
                    
                    let theadRows = '';
                    let tbodyRows = '';
                    if (s.cols) {
                        for (let sub in s.cols) {
                            let subName = sub;
                            let sStage = stageText.trim();
                            let sName = subName.trim();
                            let yText = yearText.trim();

                            if (sName.includes('مواد متغيرة') || sName.includes('متغيره')) {
                                if (sStage.includes('ابتدائي أ') || sStage.includes('ابتدائي ا')) {
                                    continue;
                                } else if (sStage.includes('ابتدائي ب')) {
                                    if (yText.includes('رابعة') || yText.includes('اولى') || yText.includes('أولى') || yText.includes('1')) subName = 'كتاب مقدس';
                                    else if (yText.includes('خامسة') || yText.includes('ثانية') || yText.includes('ثانيه') || yText.includes('تانية') || yText.includes('2')) subName = 'عقيدة';
                                    else if (yText.includes('سادسة') || yText.includes('ثالثة') || yText.includes('ثالثه') || yText.includes('تالتة') || yText.includes('3')) subName = 'تاريخ كنيسة';
                                } else if (sStage.includes('اعدادي') || sStage.includes('إعدادي') || sStage.includes('عدادي')) {
                                    if (yText.includes('اولى') || yText.includes('أولى') || yText.includes('1')) subName = 'كتاب مقدس';
                                    else if (yText.includes('ثانية') || yText.includes('ثانيه') || yText.includes('تانية') || yText.includes('2')) subName = 'عقيدة';
                                    else if (yText.includes('ثالثة') || yText.includes('ثالثه') || yText.includes('تالتة') || yText.includes('3')) subName = 'تاريخ كنيسة';
                                } else if (sStage.includes('كبار')) {
                                    if (yText.includes('اولى') || yText.includes('أولى') || yText.includes('1')) subName = 'كتاب مقدس';
                                    else if (yText.includes('ثانية') || yText.includes('ثانيه') || yText.includes('تانية') || yText.includes('2')) subName = 'تاريخ كنيسة';
                                    else if (yText.includes('ثالثة') || yText.includes('ثالثه') || yText.includes('تالتة') || yText.includes('3')) subName = 'عقيدة';
                                }
                            }

                            let subNameHtml = subName.replace(/ /g, '&nbsp;');
                            theadRows += `<th style="padding: 10px; border: 1px solid #ccc; background: #1e293b; color: white;">${subNameHtml}</th>`;
                            let scoreVal = typeof s.cols[sub] === 'object' ? s.cols[sub].total : s.cols[sub];
                            tbodyRows += `<td style="padding: 10px; border: 1px solid #ccc; background: #fdf8ec; color: #1e293b; font-weight: bold;">${scoreVal}</td>`;
                        }
                    }

                    pageHtml += `
                        <div style="border: 4px solid #c9a227; outline: 1px solid #333; outline-offset: -8px; padding: 30px 40px; margin: 0 0 20px 0; background: #fdf8ec; position: relative; height: 720px; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; box-sizing: border-box;">
                            
                            <div style="position:absolute; top:25px; right:30px;">
                                <img src="data:image/png;base64,${logoDio}" style="width:110px; height:110px; object-fit:contain;" onerror="this.style.display='none'">
                            </div>
                            <div style="position:absolute; top:25px; left:30px;">
                                <img src="/images/Logo.png" style="width:110px; height:110px; object-fit:contain; border-radius: 50%; background-color: white; padding: 5px;" onerror="this.style.display='none'">
                            </div>
                            
                            <h1 style="font-family: 'Aref Ruqaa', serif; color:#1a2744; font-size:75px; margin-bottom:0px; margin-top:5px; text-shadow: 2px 2px 4px rgba(0,0,0,0.1);">شهادة شكر وتقدير</h1>
                            
                            <p style="font-size:22px; color:#555; line-height: 1.8; text-align: center; margin-top: 15px; width: 90%;">
                                يسر&nbsp;مدرسة&nbsp;القديس&nbsp;ديديموس&nbsp;للعلوم&nbsp;الكنسية<br>
                                بكنيسة&nbsp;الشهيد&nbsp;العظيم&nbsp;مارمينا&nbsp;والبابا&nbsp;كيرلس&nbsp;السادس&nbsp;بالخصوص<br>
                                أن&nbsp;تهنئ&nbsp;الطالب<span>/</span>ة&nbsp;<strong style="color:#7a1f1f; font-size: 28px; margin: 0 5px;">${s.name.replace(/ /g, '&nbsp;')}</strong>
                            </p>
                            <p style="font-size:22px; color:#555; margin-bottom: 20px;">
                                على&nbsp;اجتياز&nbsp;السنة&nbsp;${yearText.replace(/ /g, '&nbsp;')}&nbsp;مرحلة&nbsp;${stageText.replace(/ /g, '&nbsp;')}
                            </p>
                            
                            <table style="border-collapse: collapse; width: 85%; margin: 0 auto 20px auto; font-size: 18px; text-align: center;">
                                <thead>
                                    <tr>
                                        ${theadRows}
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        ${tbodyRows}
                                    </tr>
                                </tbody>
                            </table>
                            
                            <div style="background: #fdfbf7; border: 2px solid #c9a227; border-radius: 12px; padding: 15px 20px; margin-bottom: 80px; font-size: 22px; color: #1a2744; font-weight: bold; width: 65%; display: flex; justify-content: space-around; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
                                <span>الدرجة النهائية<span> : </span><span dir="ltr">${s.total}</span></span>
                                <span>|</span>
                                <span>النسبة<span> : </span><span dir="ltr">${s.percentage.toFixed(1)}%</span></span>
                                <span>|</span>
                                <span>التقدير<span> : </span>${gradeTier}</span>
                            </div>
                            
                            <div style="position:absolute; bottom:40px; right:80px; text-align:center;">
                                <hr style="border: none; border-top: 2px solid #333; width: 160px; margin-bottom: 15px;">
                                <p style="font-size:22px; font-weight:bold; color: #1a2744; margin: 0;">إدارة المدرسة</p>
                            </div>
                            <div style="position:absolute; bottom:40px; left:80px; text-align:center;">
                                <hr style="border: none; border-top: 2px solid #333; width: 160px; margin-bottom: 15px;">
                                <p style="font-size:22px; font-weight:bold; color: #1a2744; margin: 0;">الكنيسة</p>
                            </div>
                        </div>
                    `;
                });

                pageHtml += '</div>';

                let container = document.createElement('div');
                container.innerHTML = pageHtml;

                if (pIdx === 0) {
                    worker = worker.from(container).toPdf();
                } else {
                    worker = worker.get('pdf').then(pdf => { pdf.addPage(); }).from(container).toContainer().toCanvas().toImg().toPdf();
                }
                
                await worker;
                statusBox.textContent = `⏳ جاري تجميع الصفحات (${pIdx + 1} من ${pages.length})... برجاء الانتظار`;
            }

            await worker.save();

            statusBox.style.backgroundColor = '';
            statusBox.style.color = '';
            statusBox.style.borderColor = '';
            statusBox.className = 'status-box status-success';
            statusBox.textContent = `✅ تم استخراج الشهادات بنجاح (${allStudentsData.length} شهادة في ${pages.length} صفحة).`;

        } catch (err) {
            statusBox.className = 'status-box status-error';
            statusBox.textContent = '❌ ' + err.message;
        }

        btn.disabled = false;
        loader.style.display = 'none';
      }

      function getTier(pct) {
          if (pct >= 90) return 'ممتاز';
          if (pct >= 80) return 'جيد جداً';
          if (pct >= 65) return 'جيد';
          if (pct >= 50) return 'مقبول';
          return 'دون المستوى';
      }
    </script>
      <script src="/js/layout.js"></script>
  </body>
</html>
