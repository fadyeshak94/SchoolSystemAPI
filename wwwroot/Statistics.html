<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>📊 إحصائيات النجاح والحضور</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .chart-box { background: var(--glass-bg); border-radius: 16px; padding: 20px; box-shadow: var(--glass-shadow); }
        .chart-box h3 { text-align: center; margin-bottom: 15px; font-size: 15px; color: var(--text-light); }
        .pass-high { color: var(--success); font-weight: bold; }
        .pass-mid { color: var(--warning); font-weight: bold; }
        .pass-low { color: var(--danger); font-weight: bold; }
    </style>
</head>
<body>
    
    

    <div class="controls">
        <select id="classSelect" onchange="loadStats()"></select>
    </div>

    <div id="content">
        <div style="text-align:center; padding:20px; color:var(--text-muted);">اختر فصلاً لعرض الإحصائيات أو اختر (كل الفصول)</div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        let passChart = null, attChart = null;

        window.onload = () => loadClassesDropdown('classSelect');

        async function loadStats() {
            const classId = document.getElementById('classSelect').value;
            if (!classId) return;

            document.getElementById('content').innerHTML = '<div class="spinner"></div>';
            
            const res = await fetchApi(`/dashboard/statistics?classId=${classId}`);
            if (!res || !res.subjects) {
                document.getElementById('content').innerHTML = '<div class="status-bar error" style="display:block;">❌ لا توجد بيانات كافية</div>';
                return;
            }

            let html = '<div class="charts-grid">';
            html += '<div class="chart-box"><h3>📈 نسبة النجاح لكل مادة</h3><canvas id="passChartCanvas"></canvas></div>';
            html += '<div class="chart-box"><h3>🗓️ نسبة الحضور لكل مادة</h3><canvas id="attChartCanvas"></canvas></div>';
            html += '</div>';

            html += '<div class="table-container"><table><thead><tr><th>المادة</th><th>نجاح ت1</th><th>نجاح ت2</th><th>نجاح إجمالي</th><th>نسبة الحضور</th><th>عدد الطلاب</th></tr></thead><tbody>';
            
            res.subjects.forEach(s => {
                html += `<tr>
                    <td style="font-weight:bold;">${s.label}</td>
                    <td class="${getPassClass(s.term1PassRate)}">${pct(s.term1PassRate)}</td>
                    <td class="${getPassClass(s.term2PassRate)}">${pct(s.term2PassRate)}</td>
                    <td class="${getPassClass(s.overallPassRate)}">${pct(s.overallPassRate)}</td>
                    <td>${pct(s.attendanceRate)}</td>
                    <td>${s.totalStudents}</td>
                </tr>`;
            });
            html += '</tbody></table></div>';
            document.getElementById('content').innerHTML = html;

            drawCharts(res.subjects);
        }

        function pct(v) { return v == null ? '—' : v.toFixed(1) + '%'; }
        function getPassClass(v) { return v == null ? '' : v >= 85 ? 'pass-high' : v >= 60 ? 'pass-mid' : 'pass-low'; }

        function drawCharts(subjects) {
            const labels = subjects.map(s => s.label);
            const passCtx = document.getElementById('passChartCanvas').getContext('2d');
            if (passChart) passChart.destroy();
            passChart = new Chart(passCtx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'ت1', data: subjects.map(s => s.term1PassRate), backgroundColor: '#90caf9' },
                        { label: 'ت2', data: subjects.map(s => s.term2PassRate), backgroundColor: '#1a73e8' },
                        { label: 'إجمالي', data: subjects.map(s => s.overallPassRate), backgroundColor: '#0d652d' }
                    ]
                },
                options: { responsive: true, scales: { y: { beginAtZero: true, max: 100 } } }
            });

            const attCtx = document.getElementById('attChartCanvas').getContext('2d');
            if (attChart) attChart.destroy();
            attChart = new Chart(attCtx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{ label: 'نسبة الحضور', data: subjects.map(s => s.attendanceRate), backgroundColor: '#f9ab00' }]
                },
                options: { responsive: true, scales: { y: { beginAtZero: true, max: 100 } } }
            });
        }
    </script>
    <script src="/js/layout.js"></script>
  </body>
</html>
